<svg xmlns="http://www.w3.org/2000/svg" width="740" height="416" viewBox="0 0 740 416" role="img" aria-labelledby="title description">
<title id="title">Hệ số Logistic Regression của Cleveland và Pima</title>
<desc id="description">Biểu đồ thanh ngang của các hệ số trên dữ liệu đã chuẩn hóa bằng phần train. Mốc 0 được hiển thị trên cả hai bảng dùng chung thang đo.</desc>
<rect width="740" height="416" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#16253a" font-size="14">
