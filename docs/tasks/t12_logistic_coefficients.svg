<rect x="380.00" y="169" width="12.90" height="21" fill="#246498"/>
<text x="400.90" y="184" text-anchor="start">+0.072</text>
<text x="24" y="223" font-weight="700" font-size="16">Pima</text>
<line x1="200" x2="200" y1="233" y2="334" stroke="#dde5ed"/>
<text x="200" y="354" text-anchor="middle" fill="#465c76">-1</text>
<line x1="290.0" x2="290.0" y1="233" y2="334" stroke="#dde5ed"/>
