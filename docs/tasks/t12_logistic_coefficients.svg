<line x1="380" x2="380" y1="98" y2="199" stroke="#6a7b90"/>
<line x1="470.0" x2="470.0" y1="98" y2="199" stroke="#dde5ed"/>
<line x1="560" x2="560" y1="98" y2="199" stroke="#dde5ed"/>
<line x1="650.0" x2="650.0" y1="98" y2="199" stroke="#dde5ed"/>
<text x="24" y="120">age</text>
<rect x="380.00" y="105" width="76.01" height="21" fill="#246498"/>
